<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Move Travel - Agencia de Viajes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-gray-50">

    <header class="relative h-[500px] flex items-center justify-center overflow-hidden bg-gray-900">
        <video autoplay loop muted playsinline class="absolute z-0 w-auto min-w-full min-h-full max-w-none object-cover opacity-60">
            <source src="{{ url_for('static', filename='img/banner.mp4') }}" type="video/mp4">
        </video>
        
        <div class="relative z-20 text-center text-white px-4 animate-fade-in-down">
            <h1 class="text-5xl md:text-7xl font-bold mb-4 drop-shadow-xl">Move Travel ✈️</h1>
            <p class="text-xl md:text-2xl font-light opacity-90">Tu próxima aventura comienza en Encarnación</p>
        </div>
    </header>

    <div class="container mx-auto px-4 relative z-30 -mt-16">
        <div class="bg-white p-6 rounded-xl shadow-2xl flex flex-col md:flex-row gap-4 items-center border border-gray-100">
            
            <div class="flex-1 w-full">
                <label class="block text-gray-400 text-xs font-bold mb-1 uppercase tracking-wide">¿A dónde quieres ir?</label>
                <input type="text" id="filtroPais" placeholder="Ej: Brasil, Cancún..." 
                       class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-lg py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div class="flex-1 w-full">
                <label class="block text-gray-400 text-xs font-bold mb-1 uppercase tracking-wide">Tu Presupuesto Máximo (USD)</label>
                <input type="number" id="filtroPrecio" placeholder="Ej: 1000" 
                       class="w-full bg-gray-50 border border-gray-200 text-gray-800 text-lg py-3 px-4 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition">
            </div>

            <div class="hidden md:block text-gray-400 text-sm italic px-4">
                🔍 Búsqueda automática...
            </div>
        </div>
    </div>

    <div class="container mx-auto mt-12 mb-20 px-4">
        <h2 class="text-3xl font-bold text-gray-800 mb-8 border-l-4 border-blue-600 pl-4">Destinos Disponibles</h2>
        
        <div id="contenedorViajes" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-10">
                <p class="text-gray-400 animate-pulse text-xl">Cargando destinos...</p>
            </div>
        </div>
    </div>

    <footer class="bg-gray-800 text-white py-10 mt-auto">
        <div class="container mx-auto text-center">
            <h3 class="text-2xl font-bold mb-2">Move Travel</h3>
            <p class="opacity-60 text-sm mb-4">Agencia de Viajes & Turismo</p>
            <p class="opacity-40 text-xs">© 2026 Encarnación, Paraguay.</p>
        </div>
    </footer>

    <script>
        const API_URL = '/viajes';

        // --- FUNCIÓN PRINCIPAL DE BÚSQUEDA ---
        async function buscarViajes() {
            const pais = document.getElementById('filtroPais').value;
            const precio = document.getElementById('filtroPrecio').value;

            let url = `${API_URL}?`;
            if (pais) url += `pais=${pais}&`;
            if (precio) url += `precio_max=${precio}`;

            try {
                const respuesta = await fetch(url);
                if (!respuesta.ok) throw new Error("Error conectando con el servidor");
                const viajes = await respuesta.json();
                mostrarViajes(viajes);
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('contenedorViajes').innerHTML = `
                    <div class="col-span-full text-center p-10 bg-red-50 rounded-lg border border-red-200">
                        <p class="text-red-600 font-bold text-lg">⚠️ No se pudo conectar con el sistema.</p>
                        <p class="text-red-400 text-sm mt-2">Verifica que tu app.py esté corriendo.</p>
                    </div>`;
            }
        }

        // --- FUNCIÓN PARA DIBUJAR TARJETAS ---
        function mostrarViajes(listaViajes) {
            const contenedor = document.getElementById('contenedorViajes');
            contenedor.innerHTML = ''; 

            if (listaViajes.length === 0) {
                contenedor.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-xl shadow-sm border border-dashed border-gray-300">
                        <p class="text-2xl text-gray-300 mb-2">✈️</p>
                        <p class="text-xl text-gray-500 font-medium">No encontramos viajes con ese criterio.</p>
                    </div>`;
                return;
            }

            listaViajes.forEach(viaje => {
                // Link de WhatsApp
                const mensajeWsp = `Hola Move Travel, vi en su web el viaje a *${viaje.destino}* por $${viaje.precio_usd}. Me gustaría más info.`;
                const linkWsp = `https://wa.me/595985000000?text=${encodeURIComponent(mensajeWsp)}`;

                // Link interno a la página de detalles
                const linkDetalle = `/detalle?id=${viaje.id}`;

                const tarjeta = `
                    <div class="bg-white rounded-xl overflow-hidden shadow-lg hover:shadow-2xl transition duration-300 border border-gray-100 group flex flex-col h-full">
                        
                        <a href="${linkDetalle}" class="block relative overflow-hidden h-56 cursor-pointer">
                            <img src="${viaje.imagen_url || 'https://via.placeholder.com/400x300?text=Sin+Imagen'}" 
                                 alt="${viaje.destino}" 
                                 class="w-full h-full object-cover transform group-hover:scale-110 transition duration-700">
                            
                            <div class="absolute top-3 right-3 bg-white/90 backdrop-blur text-gray-800 text-xs font-bold px-3 py-1 rounded-full shadow-md">
                                ⏱️ ${viaje.duracion_dias} Días
                            </div>
                        </a>

                        <div class="p-6 flex-1 flex flex-col">
                            <div class="mb-4">
                                <a href="${linkDetalle}" class="hover:text-blue-600 transition">
                                    <h3 class="text-2xl font-bold text-gray-800 leading-tight">${viaje.destino}</h3>
                                </a>
                                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider bg-blue-50 px-2 py-1 rounded mt-1 inline-block">
                                    ${viaje.pais}
                                </span>
                            </div>
                            
                            <p class="text-gray-600 text-sm mb-6 flex-1 line-clamp-3">
                                ${viaje.descripcion}
                            </p>
                            
                            <div class="flex gap-3 mb-6 border-t border-gray-100 pt-4">
                                ${viaje.incluye_aereo 
                                    ? '<span class="flex items-center gap-1 text-xs font-medium text-green-700 bg-green-100 px-2 py-1 rounded">✈️ Aéreo Incluido</span>' 
                                    : '<span class="flex items-center gap-1 text-xs font-medium text-orange-700 bg-orange-100 px-2 py-1 rounded">🚌 Viaje en Bus</span>'}
                            </div>

                            <div class="mt-auto">
                                <div class="mb-3">
                                    <span class="block text-xs text-gray-400">Precio x Persona</span>
                                    <span class="text-3xl font-bold text-gray-800">$${viaje.precio_usd}</span>
                                </div>
                                
                                <div class="flex gap-2">
                                    <a href="${linkDetalle}" 
                                       class="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold py-2 px-4 rounded-lg transition text-center text-sm flex items-center justify-center">
                                       Ver Detalles
                                    </a>
                                    <a href="${linkWsp}" target="_blank" 
                                       class="flex-1 bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded-lg shadow-md hover:shadow-lg transition text-center text-sm flex items-center justify-center gap-1">
                                       <span>WhatsApp</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                contenedor.innerHTML += tarjeta;
            });
        }

        document.getElementById('filtroPais').addEventListener('input', buscarViajes);
        document.getElementById('filtroPrecio').addEventListener('input', buscarViajes);

        buscarViajes();
    </script>
</body>
</html>
